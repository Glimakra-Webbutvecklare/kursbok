<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
  <title id="title">CSS box model med fyra lager</title>
  <desc id="description">Margin omsluter border, som omsluter padding, som omsluter content.</desc>
  <rect width="760" height="500" fill="#ffffff"/>
  <rect x="35" y="25" width="690" height="450" rx="10" fill="#fafafa" stroke="#999999" stroke-width="4" stroke-dasharray="12 10"/>
  <rect x="100" y="95" width="560" height="320" rx="8" fill="#ffe6e6" stroke="#c62828" stroke-width="5"/>
  <rect x="165" y="160" width="430" height="190" rx="6" fill="#e6ffe6" stroke="#2e7d32" stroke-width="5"/>
  <rect x="230" y="220" width="300" height="70" rx="5" fill="#e6e6ff" stroke="#1a237e" stroke-width="5"/>
  <g font-family="Arial, sans-serif" fill="#1f2933" text-anchor="middle">
    <text x="75" y="65" font-size="24" font-weight="700">Margin</text>
    <text x="380" y="130" font-size="24" font-weight="700">Border</text>
    <text x="380" y="195" font-size="24" font-weight="700">Padding</text>
    <text x="380" y="263" font-size="24" font-weight="700">Content</text>
    <text x="380" y="320" font-size="20">text, bild eller annat innehåll</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#3f4b55">
    <text x="75" y="94" font-size="17">luft utanför</text>
    <text x="75" y="116" font-size="17">elementet</text>
    <text x="118" y="145" font-size="17">kantlinje</text>
    <text x="182" y="210" font-size="17">luft innanför</text>
  </g>
</svg>
